name: build image and push to ghcr.io using buildx

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'branch'
        type: string
        default: 'dev'
      VERSION:
        description: 'version'
        type: string
        default: 'dev'
      IMAGE_TAG:
        description: "image tag"
        type: string
        default: 'dev'
        required: true
      PLATFORMS:
        description: 'platforms (e.g., linux/amd64 or linux/amd64,linux/arm64)'
        type: string
        default: 'linux/amd64,linux/arm64'
        required: true
jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    if: contains(inputs.PLATFORMS, 'linux/amd64')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.BRANCH }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ inputs.VERSION }}
          file: Dockerfile.trixie
          tags: ${{ env.IMAGE_PREFIX }}/guacd:${{ inputs.IMAGE_TAG }}-amd64
          provenance: false

  build-arm64:
    runs-on: ubuntu-24.04-arm
    if: contains(inputs.PLATFORMS, 'linux/arm64')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.BRANCH }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ inputs.VERSION }}
          file: Dockerfile.trixie
          tags: ${{ env.IMAGE_PREFIX }}/guacd:${{ inputs.IMAGE_TAG }}-arm64
          provenance: false

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    if: inputs.PLATFORMS == 'linux/amd64,linux/arm64' || inputs.PLATFORMS == 'linux/arm64,linux/amd64'
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE_PREFIX }}/guacd:${{ inputs.IMAGE_TAG }} \
            ${{ env.IMAGE_PREFIX }}/guacd:${{ inputs.IMAGE_TAG }}-amd64 \
            ${{ env.IMAGE_PREFIX }}/guacd:${{ inputs.IMAGE_TAG }}-arm64